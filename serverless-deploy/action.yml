name: serverless-deploy
description: Deploy a using AWS Codebuild
inputs:
  DOCKER_USER:
    description: Docker registry username
    required: true
  DOCKER_PASS:
    description: Docker registry password
    required: true
  PROJECT_NAME:
    description: The CodeBuild project name
    required: false
    default: acuity-remote
  ENVIRONMENT:
    description: environment name
    required: true
  AWS_ACCESS_KEY_ID:
    description: role to assume
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: role to assume
    required: true
  WORKING_DIR:
    description: The dir of the rails app
    required: false
    default: .
  AWS_REGION:
    description: the region to deploy to
    required: false
    default: us-east-1
  GIT_SHA:
    description: the git sha you want to deploy
    required: false
  SLACK_BOT_TOKEN:
    description: slackbot token
    required: true
  RUN_MIGRATION:
    description: Run Hasura migration
    required: false
    default: "false"
  RUBY_VERSION:
    description: the version of ruby to use (optional, in place of .ruby-version file)
    required: false
  PREINSTALLED_RUBY_IMAGE:
    description: Optional CodeBuild image containing the exact Ruby version in rails_api/.ruby-version. Incompatible with RUBY_VERSION.
    required: false
  BUNDLER_VERSION:
    description: Bundler version to install (defaults to Gemfile.lock)
    required: false

  BUNDLE_CACHE_SCOPE:
    description: Optional cache key prefix for the Ruby, architecture and CodeBuild image. Enables CI cleanup.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate preinstalled Ruby inputs
      if: ${{ inputs.PREINSTALLED_RUBY_IMAGE != '' }}
      shell: bash
      env:
        SELECTED_SHA: ${{ inputs.GIT_SHA }}
        RUBY_OVERRIDE: ${{ inputs.RUBY_VERSION }}
      run: |
        if [[ -n "$RUBY_OVERRIDE" ]]; then
          echo 'PREINSTALLED_RUBY_IMAGE uses rails_api/.ruby-version. Leave RUBY_VERSION empty.' >&2
          exit 1
        fi
        if [[ -n "$SELECTED_SHA" && "$SELECTED_SHA" != "$GITHUB_SHA" ]]; then
          echo 'Select the intended workflow ref and leave GIT_SHA empty or use its full matching SHA.' >&2
          exit 1
        fi
    - name: Checkout from GIT_SHA
      if: ${{ inputs.GIT_SHA}}
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.GIT_SHA }}
    - name: Otherwise, Checkout from HEAD
      if: ${{ ! inputs.GIT_SHA }}
      uses: actions/checkout@v4
    - name: Use ruby version user input if present
      if: ${{ inputs.PREINSTALLED_RUBY_IMAGE == '' && inputs.RUBY_VERSION != '' }}
      shell: bash
      run: echo "RUBY_VERSION=${{ inputs.RUBY_VERSION }}" >> $GITHUB_ENV
    - name: Otherwise, check .ruby-version
      if: ${{ inputs.PREINSTALLED_RUBY_IMAGE == '' && inputs.RUBY_VERSION == '' }}
      shell: bash
      working-directory: ${{ inputs.WORKING_DIR }}
      run: echo "RUBY_VERSION=`cat .ruby-version`" >> $GITHUB_ENV
    - name: Prepare CodeBuild Ruby install phase
      id: ruby-install
      if: ${{ inputs.PREINSTALLED_RUBY_IMAGE == '' }}
      shell: bash
      run: |
        {
          echo 'phase<<EOF'
          printf 'install:\n    runtime-versions:\n      ruby: %s\n' "$RUBY_VERSION"
          echo EOF
        } >> "$GITHUB_OUTPUT"
    - name: Configure AWS credentials AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are pulled from secrets
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.AWS_REGION }}
    - name: Setup SAM
      if: ${{ inputs.PREINSTALLED_RUBY_IMAGE == '' }}
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true
    - name: Prepare bundle cache key
      id: bundle-cache
      if: ${{ inputs.BUNDLE_CACHE_SCOPE != '' }}
      shell: bash
      env:
        BUNDLE_CACHE_SCOPE: ${{ inputs.BUNDLE_CACHE_SCOPE }}
      run: |
        if [[ ! "$BUNDLE_CACHE_SCOPE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
          echo "BUNDLE_CACHE_SCOPE must contain only letters, digits, underscores and hyphens." >&2
          exit 1
        fi
        printf 'key_line=key: %s-$(codebuild-hash-files rails_api/.ruby-version rails_api/Gemfile.lock)\n' "$BUNDLE_CACHE_SCOPE" >> "$GITHUB_OUTPUT"
    - name: Run CodeBuild
      uses: aws-actions/aws-codebuild-run-build@v1
      env:
        CI: "true"
        DOCKER_USER: ${{ inputs.DOCKER_USER }}
        DOCKER_PASS: ${{ inputs.DOCKER_PASS }}
        GIT_SHA: ${{ github.sha }}
        AWS_REGION: ${{ inputs.AWS_REGION }}
      with:
        env-vars-for-codebuild: ${{ inputs.PREINSTALLED_RUBY_IMAGE != '' && 'DOCKER_USER,DOCKER_PASS,CI,GIT_SHA,AWS_REGION' || inputs.BUNDLE_CACHE_SCOPE != '' && 'DOCKER_USER,DOCKER_PASS,CI' || 'DOCKER_USER,DOCKER_PASS' }}
        project-name: ${{ inputs.PROJECT_NAME }}
        image-override: ${{ inputs.PREINSTALLED_RUBY_IMAGE }}
        disable-source-override: false
        source-version-override: ${{ github.sha }}
        buildspec-override: |
          version: 0.2
          cache:
            ${{ steps.bundle-cache.outputs.key_line }}
            paths:
              - 'rails_api/vendor/bundle/**/*'
          phases:
            ${{ steps.ruby-install.outputs.phase }}
            build:
              commands:
                - echo "== INIT RUBY VERSION =="
                - |
                  if ${{ inputs.PREINSTALLED_RUBY_IMAGE != '' }}; then
                    RBENV_VERSION="$(cat rails_api/.ruby-version)" || exit 1
                    export RBENV_VERSION
                    if ! actual_ruby="$(ruby -e 'print RUBY_VERSION')"; then
                      printf 'Ruby %s is unavailable in the CodeBuild image.\n' "$RBENV_VERSION" >&2
                      exit 1
                    fi
                    if [ "$actual_ruby" != "$RBENV_VERSION" ]; then
                      printf 'Expected Ruby %s, got %s.\n' "$RBENV_VERSION" "$actual_ruby" >&2
                      exit 1
                    fi
                  fi
                - ruby -v
                - echo "== DOCKER LOGIN =="
                - set +x
                - printf '%s' "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
                - echo "== DEPLOY =="
                - cd rails_api
                - |
                  BUNDLER_VERSION="${{ inputs.BUNDLER_VERSION }}"
                  # With preinstalled Ruby, Bundler can select the lockfile version itself.
                  if ${{ inputs.PREINSTALLED_RUBY_IMAGE == '' }} || [ -n "$BUNDLER_VERSION" ]; then
                    if [ -z "$BUNDLER_VERSION" ]; then
                      BUNDLER_VERSION="$(awk '/BUNDLED WITH/{getline; gsub(/^[[:space:]]+/, ""); print; exit}' Gemfile.lock)"
                    fi
                    test -n "$BUNDLER_VERSION"
                    gem install bundler --version "$BUNDLER_VERSION" --no-document
                    bundle --version
                  fi
                - RAILS_ENV=${{ inputs.ENVIRONMENT}} bin/deploy

    - name: Check Deploy Failure
      if: ${{ failure() }}
      id: check-deploy-failure
      shell: bash
      run: echo '::set-output name=DEPLOY_FAILED::true'
    - name: Post to a Slack channel
      if: ${{ always() && (inputs.PREINSTALLED_RUBY_IMAGE != '' || success()) }}
      id: slack
      uses: slackapi/slack-github-action@v1.23.0
      with:
        channel-id: "C04GQE833LY"
        slack-message: "Serverless Rails API deployed to ${{ inputs.ENVIRONMENT}}\nGitHub build result: ${{ job.status }}\nBranch: ${{ github.head_ref || github.ref_name }} \nGit SHA: ${{ inputs.GIT_SHA }}"
      env:
        SLACK_BOT_TOKEN: ${{ inputs.SLACK_BOT_TOKEN }}

    - name: Call Hasura Action
      if: ${{ inputs.RUN_MIGRATION == 'true' }}
      uses: AcuityPPM/acuity-actions/hasura@v6
      with:
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        AWS_ACCESS_KEY_ID: ${{ inputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        HASURA_DIR: hasura
        AWS_REGION: ${{ inputs.AWS_REGION }}
        GIT_SHA: ${{ inputs.GIT_SHA }}
        SLACK_BOT_TOKEN: ${{ inputs.SLACK_BOT_TOKEN }}
